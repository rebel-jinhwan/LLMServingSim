[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmservingsim"
version = "2.0.0"
description = "A cycle-level LLM serving simulator: a Python frontend over ASTRA-Sim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml",
    "rich",
    "pandas",
    "numpy",
    "matplotlib",       # bench/core/plots.py, reached by `python -m bench validate`
    "huggingface_hub",  # config auto-fetch on a profiler cache miss
]

[project.urls]
Homepage = "https://llmservingsim.ai"
Source = "https://github.com/casys-kaist/LLMServingSim"

[project.optional-dependencies]
# The profiler and bench need vLLM and its stack, which is installed per
# environment (scripts/install-vllm.sh, or the container image).
dev = ["pytest"]

# Installed for the import paths, not to be published: the package names here
# are the repository's own top-level directories, which are too generic to put
# on an index. `pip install -e .` is what makes `import serving` / `platforms`
# work from anywhere, so an out-of-tree platform plugin and `python tests/run.py`
# need no PYTHONPATH. Moving these under an `llmservingsim` namespace is the
# packaging work, not this.
[tool.setuptools.packages.find]
include = ["bench*", "platforms*", "profiler*", "serving*", "workloads*"]
exclude = ["profiler.v0*"]

[tool.setuptools.package-data]
platforms = ["*/devices/*.yaml"]
profiler = ["models/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
