# OpenAI gpt-oss family (20b, 120b) — class catalog. MoE decoder with GQA
# attention (sliding-window on alternate layers), MXFP4 experts.
#
# Canonical layer names mirror vLLM's attribute names (see
# vllm/model_executor/models/gpt_oss.py).

sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, rotary_emb, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: []
  mlp_moe:   [moe]
  head:      [final_layernorm, lm_head, sampler]


catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: TransformerBlock
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
    rotary_emb:
      vllm: RotaryEmbedding
    o_proj:
      vllm: RowParallelLinear
      within: OAIAttention
    final_layernorm:
      vllm: RMSNorm
      within: GptOssModel
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
  moe:
    moe:
      vllm: MLPBlock
