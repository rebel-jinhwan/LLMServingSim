# MiniMax M2 family (M2, M2.5, M2.7) — class catalog. MoE decoder with GQA
# attention and a DeepSeek-V3-style router; every block is an MoE block.
#
# Canonical layer names mirror vLLM's attribute names (see
# vllm/model_executor/models/minimax_m2.py).

sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, rotary_emb, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: []
  mlp_moe:   [moe]
  head:      [final_layernorm, lm_head, sampler]


catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: MiniMaxM2DecoderLayer
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
    rotary_emb:
      vllm: RotaryEmbedding
    o_proj:
      vllm: RowParallelLinear
      within: MiniMaxM2Attention
    final_layernorm:
      vllm: RMSNorm
      within: MiniMaxM2ForCausalLM
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
  moe:
    moe:
      vllm: MiniMaxM2MoE
