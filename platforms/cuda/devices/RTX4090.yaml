# NVIDIA GeForce RTX 4090. Hardware facts every cluster config naming this
# device shares; an instance's npu_mem block overrides any of them.
name: RTX4090
mem_size: 24       # GB
mem_bw: 1008       # GB/s
mem_latency: 0     # ns
support_fp8: true      # fp8 tensor cores
support_fp8_kv: true   # and an fp8 KV cache in the attention kernel
