# Rebellions RBLN-CR03, the name rebel.get_npu_name() reports. Hardware
# facts every cluster config naming this device shares; an instance's
# npu_mem overrides any of them.
name: RBLN-CR03
npu_mem:
  mem_size: 140      # GB, as rbln-smi reports the card
  mem_bw: 2000       # GB/s. Not measured: a placeholder carried over from the
                     # first cluster configs. A step-granularity profile already
                     # contains the device's memory traffic, so this only feeds
                     # ASTRA-Sim's local-mem-bw for offloading paths.
  mem_latency: 0     # ns
# fp8 KV needs the in-memory attention kernel, which only RBLN-CR13 has.
kv_cache_dtypes: [auto]
