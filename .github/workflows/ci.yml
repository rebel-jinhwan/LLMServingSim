name: CI

# Lint and type-check only. Nothing here needs a GPU, an NPU, vLLM or an
# ASTRA-Sim build, so it runs on a stock GitHub runner in under a minute.
# The simulator's own behaviour check is ./llmservingsim/serving/validate.sh,
# which does need all of that and stays a local, pre-PR step.

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No submodules: astra-sim is excluded from both tools.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ruff and mypy are pinned in pyproject.toml's `dev` extra, so this is
      # the same tooling a local checkout gets. The runtime dependencies come
      # with it, which is what lets mypy see real types for rich, pandas and
      # pydantic instead of Any.
      - run: pip install -e '.[dev]'

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy
